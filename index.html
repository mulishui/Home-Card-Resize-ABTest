<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Device Card Size A/B Test</title>
<style>
/* ========== 全局 ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#eceef2;color:#1c1d21;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px 60px;
}
body.dragging{user-select:none;cursor:grabbing}

/* ========== 顶部调研控制条 ========== */
.topbar{
  width:100%;max-width:880px;margin-bottom:20px;
  display:flex;flex-direction:column;gap:14px;align-items:center;
}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:.3px}
.topbar .sub{font-size:13px;color:#83868f;text-align:center;line-height:1.6}
.seg{display:inline-flex;background:#dfe2e8;border-radius:11px;padding:3px;gap:3px}
.seg button{
  border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;
  color:#5d606a;padding:7px 18px;border-radius:9px;cursor:pointer;
  transition:background .18s,color .18s,box-shadow .18s;white-space:nowrap;
}
.seg button.on{background:#fff;color:#1c1d21;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ========== 手机外框 ========== */
.stage{width:100%;display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{
  width:340px;height:700px;background:#f5f6f8;border-radius:38px;
  box-shadow:0 18px 44px rgba(20,22,30,.16),0 0 0 9px #1c1d21,0 0 0 10px #35373f;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
}
.notch{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:104px;height:26px;background:#1c1d21;border-radius:14px;
}
/* PC 端模拟手机观感：手机上 CSS px 的实际物理尺寸比桌面显示器小（手机贴近看、
   显示器按标准 96 CSS px/英寸渲染），同样的字号/图标搬到 PC 上会显得偏大粗犷。
   缩小整个 .phone 模型来模拟这种"手机拿在手上看"的尺寸感；.phone-wrap 同步
   收窄到缩放后的尺寸，避免 transform 不影响布局占位导致周围凭空多出一圈死区 */
@media (min-width:761px){
  /* flex-shrink:0：.phone-wrap 显式收窄到缩放后的尺寸后，.phone 自己作为
     flex 子项默认允许被压缩，会在 transform 生效前就先被挤小一轮，
     跟 transform:scale 叠加导致缩放两次；锁死原始 340×700 避免这个坑 */
  .phone{transform:scale(.85);transform-origin:top center;flex-shrink:0}
  .phone-wrap{width:289px;height:595px}
}
/* ========== 编辑态导航栏 ========== */
/* statusbar/navbar/edit-tip 打包进 .phone-head 一起吸顶：桌面端 .screen 自己
   有独立高度+滚动条，.phone-head 天然不受影响；移动端 .phone 高度变成 auto，
   .screen 撑满内容不再自己滚动，改由页面（document）整体滚动，这时
   position:sticky 才会真正生效，让这块头部在页面往下滚时贴在视口顶部不动 */
/* -webkit-transform:translateZ(0) 把 .phone-head 提升成独立合成层：iOS Safari
   有个已知 bug，position:sticky 元素处于"吸顶"状态时，内部子元素只改 opacity/
   color 这类非几何属性有时不会触发重绘，导致 Done/Cancel 这类靠 opacity 切换
   显隐的按钮退出编辑态后视觉上原地冻结（保留退出前那一帧的颜色/置灰状态），
   但其实 DOM 状态已经是对的。提升合成层能让这部分内容的重绘不再被跳过 */
.phone-head{position:sticky;top:0;z-index:4;background:#f5f6f8;flex:0 0 auto;padding-top:20px;-webkit-transform:translateZ(0);transform:translateZ(0)}
.navbar{
  flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px 12px;font-size:15px;
}
/* 常规态下 Cancel/Done 不出现，只有进入编辑态（长按任意卡片触发）才显示；
   用 opacity+pointer-events 而不是 display:none，是因为这两个 .act 本来就靠
   .navbar 的 justify-content:space-between 把标题撑在正中间，opacity 切换不会
   让它们在布局里消失，两态之间标题位置不会跳动 */
.navbar .act{color:#1c1d21;opacity:0;pointer-events:none;cursor:pointer;transition:opacity .2s,color .2s}
.navbar .act.done{font-weight:600}
.phone.editing .navbar .act{opacity:1;pointer-events:auto}
/* Done 默认（刚进编辑态、还没做任何改动）置灰且不可点，跟 Cancel 统一成同一个
   颜色是等做出改动后才会发生的事——markDirty() 命中改动时才会补上 .dirty 类，
   见 phone() 里 enterEditMode/markDirty 和 enableSort()/openSheet() 里的调用点。
   选择器特异度（.phone.editing + .navbar + .act + .done + :not(.dirty)，5 个类）
   必须压过上面 .phone.editing .navbar .act（4 个类）才能在编辑态下也保持置灰，
   两条规则都带 .phone.editing 前缀、只是多一层 :not()，不会漏判成"编辑态之外
   也置灰"——常规态下反正整体 opacity:0，这条规则本来就不生效 */
.phone.editing .navbar .act.done:not(.dirty){color:#b9bbc1;pointer-events:none}
.navbar .title{font-size:16px;font-weight:600}
/* 胶囊形：border-radius 直接给一个远大于自身高度一半的值，不用跟着内容高度手算圆角数值 */
/* 自适应宽度、水平居中，按钮间隔靠 flex gap 固定 24px，不依赖 space-around 摊开间距，
   button 自身也不需要横向 padding 撑间距 */
.batch-bar{
  position:absolute;left:50%;bottom:24px;z-index:5;
  background:#fff;border-radius:999px;box-shadow:0 4px 16px rgba(20,22,30,.15);
  display:flex;gap:24px;padding:8px 20px;
  transform:translate(-50%,120%);opacity:0;transition:transform .25s ease,opacity .25s ease;
  pointer-events:none;
}
.batch-bar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
/* 图标（24px）+ 文案上下结构；文案 10px、颜色跟卡片房间名（.sub）同款浅灰，
   图标用更深的颜色跟文案拉开层次，是常见的"深色图标+浅色说明文字"底部菜单配色。
   上下留白由 .batch-bar 自己的 8px padding 撑出 */
.batch-bar button{
  background:none;border:0;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:#1c1d21;
}
.batch-bar button .bico{width:24px;height:24px;color:#1c1d21}
.batch-bar button .bico svg{width:100%;height:100%;display:block}
.batch-bar button .blabel{font-size:10px;color:#a8abb3;white-space:nowrap}

/* ========== 方案 B：点 ⤢ 弹出的尺寸选择底部面板 ========== */
/* 遮罩/面板都限定在 .phone 内部（跟 .ghost/.batch-bar 同款写法），
   靠 .phone 自带的 overflow:hidden 天然裁掉，不会盖住整个页面 */
.sheet-mask{
  position:absolute;inset:0;z-index:6;background:rgba(20,22,30,.4);
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:7;
  background:#f5f6f8;border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(20,22,30,.18);
  padding:18px 0 40px;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
  user-select:none;-webkit-user-select:none;
}
.sheet.show{transform:translateY(0);pointer-events:auto}
/* 关闭按钮和标题不共用一行：改成纵向排列，关闭按钮在上、靠右对齐（align-self:flex-end），
   标题在下，两者间固定 8px（flex 的 gap） */
.sheet-head{
  display:flex;flex-direction:column;gap:8px;
  padding:0 18px 4px;
}
.sheet-title{font-size:20px;font-weight:600;letter-spacing:.2px}
/* 滑动提示语，跟尺寸文案统一成房间名文本同色 #a8abb3；标题到提示语紧凑的 4px
   （上面 .sheet-head 的 padding-bottom），提示语到卡片 16px（头部区域到卡片的
   间距，这个 16 从提示语的底部量起） */
.sheet-hint{font-size:15px;color:#a8abb3;padding:0 18px 16px;line-height:1.4}
.sheet-close{
  background:none;border:0;color:#8a8d96;width:22px;height:22px;padding:0;flex:0 0 auto;
  align-self:flex-end;
}
.sheet-close svg{width:100%;height:100%;display:block}
.sheet-track{overflow:hidden;touch-action:pan-y}
.sheet-track-inner{display:flex}
/* 面板高度必须固定（按这个设备支持的最大尺寸档位），切换到小档位时面板本身不能跟着
   变矮：.sheet-track-inner 是 display:flex 的行容器，height:auto 时天然等于全部
   .slide 里最高的那一屏的自然高度，不用 JS 量测也不用过渡动画即可当"固定高度"用。
   矮档位的 .slide 被行容器默认的 align-items:stretch 拉伸到这个固定高度后，靠自己
   justify-content:center 把卡片+尺寸文案这个内容块居中，比最高档矮多少、上下留白
   就多多少（过程见 CHANGELOG.md「第二十轮」） */
.sheet-track-inner .slide{
  flex:0 0 100%;padding:0 10px;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
/* 当前档位文案，跟在卡片下面，固定 8px 间距（gap，上面已定义）；文案本身到圆点
   指示器的 16px、圆点到确认按钮的 16px、按钮到面板底边的 40px 都不在这里，是
   .sheet-dots/.sheet 自己的 padding，理由见那两条规则旁的注释 */
.slide-label{font-size:14px;font-weight:500;color:#a8abb3;flex:0 0 auto}
/* 不计入轮播/圆点的隐藏参照 slide（用来把面板高度撑到 2x2 档），visibility:hidden
   保留它在 flex 布局里的占位（撑高度）但完全不可见、不可点、无障碍树里也不存在 */
.slide-ref{visibility:hidden}
/* 面板只展示单张预览卡片，不需要真实列表那套"多张卡片共用网格轨道、靠
   margin-bottom 让出行间距"的排布引擎——早先直接复用 CSS Grid + --unit
   轨道高度（h*unit）反而引入了列表专属的"轨道比卡片本身多出一份 gap"的
   假设，卡片再靠 margin-bottom 吃掉这份多余空间，视觉上把卡片顶死在轨道
   顶部、留白全部堆在底部。改成普通 flex 容器 + 卡片显式宽高公式，让卡片
   本身的盒子刚好等于目标尺寸，不再有轨道和卡片本身尺寸不一致的问题 */
.sheet-grid{display:flex;justify-content:center;width:100%}
/* 面板预览卡片的宽高用独立于真实列表列数/行轨道的固定公式——宽度：L/M（占满整行，
   --pw=2）上限 368px，够宽时封顶，不够宽（本 demo 手机内容区远小于 368）就用
   .slide 自带的 24px 左右内边距撑到底、跟着容器宽度走；S/D（--pw=1，半行宽）在
   "L 宽度"基础上折半再减一个 --gap（跟 L 是否封顶无关，统一用实际算出来的 --l-w
   反推）。高度：--ph 是"半个 d 档"的个数（s=0.5、d/m=1、l=2），代入"d 固定 120、
   其余尺寸以此为基准"的公式——ph 份 --card-h 加上 (ph-1) 份 --gap */
.sheet-grid .card{
  --l-w:min(368px, 100%);
  width:calc(var(--l-w) / 2 * var(--pw) - var(--gap) * (2 - var(--pw)));
  height:calc(var(--ph) * var(--card-h) + (var(--ph) - 1) * var(--gap));
}
/* .plan-B .card 的 margin-bottom:var(--gap) 是给真实列表相邻卡片让间距用的，
   面板只有一张卡片、且改用了上面的显式高度公式，这份 margin 留着的话会在
   卡片下方多出一截空白、把"整体居中"的效果重新抵消掉——选择器故意写成
   ".sheet-grid.plan-B .card"（三个类选择器）而不是简单覆盖，是为了在特异度
   上稳赢 ".plan-B .card"（两个类选择器），不依赖两条规则谁的源码顺序更靠后 */
.sheet-grid.plan-B .card{margin-bottom:0;min-height:0}
.sheet-grid .card,.sheet-grid .card *{pointer-events:none}
.sheet-grid .resize,.sheet-grid .card .check{display:none}
/* .sheet-grid .resize 隐藏后面板里不再需要给尺寸按钮/勾选圆圈留白，s（1x0.5）
   档预览卡片的文案原样继承了列表卡片专属的 margin-right（给按钮让位用的），
   面板里没有按钮，不释放这份留白会让本来空间就紧张的 s 档设备名很容易被截断
   成省略号；选择器写成 .sheet-grid.plan-B（两个类）是为了特异度稳赢
   .plan-B .card[...] .txt（同样两个类，但不依赖源码顺序谁在后面） */
.sheet-grid.plan-B .card[data-size="1x0.5"] .txt{margin-right:0}
/* padding-top:16 是"当前档位文案到圆点"的间距，padding-bottom:16 是"圆点到确认
   按钮"的间距，跟 .sheet 的 padding-bottom:40 一样都是固定值 */
.sheet-dots{display:flex;justify-content:center;gap:6px;padding:16px 0 16px}
.sheet-dots .dot{width:6px;height:6px;border-radius:50%;background:#dfe2e8;transition:background .2s}
.sheet-dots .dot.active{background:#1c1d21}
/* 胶囊形（跟 .batch-bar 同款写法）：border-radius 直接给一个远大于自身高度一半的值，
   不用跟着按钮高度手算圆角数值 */
.sheet-confirm{
  display:block;width:calc(100% - 36px);margin:0 18px;padding:13px;
  background:#1c1d21;color:#fff;border:0;border-radius:999px;
  font-size:15px;font-weight:600;
}

/* 页面滚动区 */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:4px;cursor:grab}
.screen::-webkit-scrollbar{display:none}
/* 桌面端在空白处按住拖拽模拟滚动时的态（见 enableBlankScroll） */
.screen.blank-dragging{cursor:grabbing;user-select:none}

/* ========== 设备卡片网格（A/B 差异核心） ========== */
.grid{
  display:grid;padding:0 var(--edge) 40px;
  grid-template-columns:repeat(var(--cols),1fr);
  gap:var(--gap);
}
/* 选中卡片后浮起的 .batch-bar 会盖住列表底部：多选模式下把网格底部内边距
   加大到"实测浮层高度 + 32px"（浮层实测 71px），滚到底也不会被浮层挡住
   最后一张卡片 */
.phone:has(> .batch-bar.show) .grid{padding-bottom:103px}
.card{
  background:#fff;border-radius:var(--radius);padding:var(--pad);
  min-height:var(--card-h);min-width:0;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 1px 3px rgba(20,22,30,.06);
  position:relative;touch-action:pan-y;cursor:grab;
  user-select:none;-webkit-user-select:none;
}
/* 编辑态卡片抖动（仿 iOS 桌面图标编辑态）：只有进入编辑态（长按任意卡片触发，
   见 enableSort() 的 start() 调用 _enterEditMode()）才播放，常规态下静止。
   相邻卡片用两条方向相反的关键帧错开（下面的 nth-child(even)），JS 里的
   enableJiggle() 再给每张卡片随机负 animation-delay/时长，避免整屏卡片像一个
   模子刻出来一样齐刷刷同步转——真实 iOS 图标抖动也是各转各的、互不同步。
   关键帧动的是独立的 rotate 属性，不是 transform:rotate()：换位时 flip() 要靠
   JS 给同一张卡片的 transform 临时赋值做位移动画，而 CSS 动画正在跑的属性
   永远会覆盖内联样式对同一属性的赋值——如果两者都抢 transform，flip() 设的
   位移会被每一帧的旋转值直接盖掉，视觉上就是换位瞬间跳变、没有滑动过程。
   rotate/translate/scale 是浏览器原生支持的独立变换属性，彼此不互相覆盖，
   让动画转着的同时 flip() 还能用 translate 顺畅走位移动画 */
.phone.editing .card{animation:jiggle-a .26s ease-in-out infinite}
@keyframes jiggle-a{0%,100%{rotate:-1.2deg}50%{rotate:1.2deg}}
@keyframes jiggle-b{0%,100%{rotate:1.2deg}50%{rotate:-1.2deg}}
.phone.editing .card:nth-child(even){animation-name:jiggle-b}
/* 拖拽中的源卡片（内容已被 .placeholder 隐藏成空占位块）、浮层里的卡片克隆
   （浮层自己的 translate/scale 由 JS 跟手控制，再叠加旋转动画会显得冲突）、
   方案 B 面板里纯展示的预览卡片，都不需要抖动 */
.phone.editing .card.placeholder,.phone.editing .ghost .card,.phone.editing .sheet-grid .card{animation:none}
/* 选择器特异度必须压过 .phone.editing .card（三个类）才赢得过它——跟上面
   "CSS 动画覆盖内联样式"是同一类坑的另一面：这里是两条 animation 规则互相压，
   特异度不够高的那条即使在源码后面也赢不了。三个排除对象（拖拽源卡片占位块、
   浮层卡片克隆、方案 B 面板预览卡片）都是 .phone 的后代，统一加上 .phone.editing
   前缀即可把特异度从两个类提到四个类，稳赢 */
@media (prefers-reduced-motion:reduce){
  .phone.editing .card{animation:none}
}
.card .row1{display:flex;align-items:flex-start;justify-content:space-between}
.card .ico{
  width:var(--ico);height:var(--ico);flex:0 0 auto;color:#c2c5cc;
}
.card .ico svg{width:100%;height:100%;display:block}
.card .name{
  font-size:var(--fs-name);font-weight:600;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card .sub{
  font-size:var(--fs-sub);color:#a8abb3;margin-top:2px;margin-right:calc(var(--btn) + 6px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card .sub-batt{display:inline-flex;align-items:center;gap:3px;margin-left:6px;color:rgba(0,0,0,.7)}
.card .sub-batt svg{width:13px;height:13px;flex:0 0 auto}
.card .txt{margin-top:var(--txt-mt)}
/* row2 默认对布局零影响，.txt 表现得跟直接挂在 .card 下完全一样；
   .ctrl 只在 2x1/2x2 档位下才会显示（见下面 .plan-A 的尺寸规则） */
.card .row2{display:contents}
.card .ctrl{display:none}
.card .ctrl .step{
  flex:1 1 0;height:40px;border-radius:20px;background:#e4e6ea;color:#8e9198;
  font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.card .ctrl .stepval{font-size:24px;font-weight:700;color:#1c1d21;flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.card .ctrl .stepval svg{width:0.72em;height:0.72em;flex:0 0 auto}
/* barlabel：亮度条/存储用量条共用，条形本身固定 40 高，数值/文案直接摆在条内部
   居中，而不是像 .bar+.val 那样另起一个元素挤在旁边 */
.card .ctrl .barlabel{
  position:relative;flex:1 1 auto;width:100%;min-width:0;height:40px;border-radius:20px;
  background:#e4e6ea;overflow:hidden;
}
.card .ctrl .barlabel .fill{position:absolute;left:0;top:0;bottom:0;background:#c7cad1}
.card .ctrl .barlabel .label{
  position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:flex-start;gap:8px;
  font-size:13px;font-weight:400;color:rgba(0,0,0,.7);white-space:nowrap;padding:0 16px;
}
.card .ctrl .barlabel .label svg{width:18px;height:18px;flex:0 0 auto}
/* 门锁 2x1：两行紧凑信息，图标+文字左对齐，字号先定 12px（2x1 控件行预算只有 60px，
   两行需要压缩着放），实测有富余再跟 barlabel 的 13px 对齐 */
.card .ctrl .lockinfo{display:flex;flex-direction:column;gap:6px;width:100%;min-width:0}
.card .ctrl .lockrow{
  display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(0,0,0,.7);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card .ctrl .lockrow svg{width:14px;height:14px;flex:0 0 auto;color:#a8abb3}
.card .ctrl .lockdiv{width:1px;height:12px;background:#d8dade;flex:0 0 auto;margin:0 2px}
/* 扫地机 2x2：状态摘要 + 2x3 任务网格，网格行用 1fr 自动吃满 .ctrl 剩余高度，
   不用手动算按钮像素高度 */
.card .ctrl .vacuumpanel{display:flex;flex-direction:column;gap:10px;width:100%;height:100%;min-height:0}
.card .ctrl .vstatus{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(0,0,0,.7);flex:0 0 auto}
.card .ctrl .vstatus svg{width:16px;height:16px;flex:0 0 auto;color:#a8abb3}
.card .ctrl .vtasks{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px;min-height:0}
.card .ctrl .vtask{
  display:flex;align-items:center;gap:8px;background:#eef0f3;border-radius:14px;padding:0 12px;
  font-size:12.5px;color:#1c1d21;min-width:0;
}
.card .ctrl .vtask svg{width:16px;height:16px;flex:0 0 auto;color:#1c1d21}
.card .ctrl .vtask span{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-overflow:ellipsis;line-height:1.25;
}
/* Smart Hub 事件图标像参考截图里的头像堆叠一样互相轻微重叠（负 margin-left），
   每个图标带一圈跟卡片同色的描边，把重叠的边界"切"出一条缝，视觉上才不会糊成一片；
   最右边跟 .check 勾选圆圈的重叠也是同一个效果——不再刻意留白躲开，直接贴着走，
   勾选圆圈自身的白色/蓝色底能盖住下面图标的一角，跟头像堆叠 + 右下角勾选是同一套语言 */
.card .ctrl .events{display:flex;flex:0 0 auto}
.card .ctrl .event{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:#eef0f3;color:#8e9198;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff;
}
.card .ctrl .event:not(:first-child){margin-left:-14px}
.card .ctrl .event svg{width:60%;height:60%}
/* lmode/lspectrum 只在灯类设备的 2x2 档位下才显示（见下方 [data-size="2x2"] 的
   :has(.lspectrum) 覆盖），2x1 档只露出亮度条，默认先隐藏 */
.card .ctrl .lmode{display:none;flex:0 0 auto;width:100%;height:32px;background:#eef0f3;border-radius:10px;padding:2px;gap:2px}
.card .ctrl .lmode-opt{flex:1 1 0;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:11px;font-weight:600;color:#8e9198}
.card .ctrl .lmode-opt.active{background:#fff;color:#1c1d21;box-shadow:0 1px 3px rgba(20,22,30,.12)}
.card .ctrl .lspectrum{
  display:none;border-radius:10px;
  background:
    linear-gradient(to bottom, rgba(255,255,255,.9), rgba(255,255,255,0) 45%),
    linear-gradient(to right, #ff3b30, #ffcc00, #34c759, #0a84ff, #af52de, #ff3b30);
}
.card .check{
  position:absolute;right:10px;bottom:10px;width:var(--btn);height:var(--btn);border-radius:50%;
  border:1.5px solid #c7cad1;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:transparent;line-height:1;
}
.card.selected .check{background:#0a84ff;border-color:#0a84ff;color:#fff}
/* ?select=off：见 JS 里 SELECT_ENABLED 的说明，隐藏勾选圆圈 + 确保浮层不会出现
   （浮层本来就只在 toggleSelect 里加 .show，这里是双保险，不依赖 JS 分支写对） */
.no-select .check,.no-select .batch-bar{display:none}
/* 常规态（未进入编辑态）下勾选圆圈也不出现，跟 ?select=off 是两套独立门槛，
   分别用不同的祖先选择器，互不干扰、可以同时生效 */
.phone:not(.editing) .check{display:none}

/* 右上角：调整尺寸入口 */
.resize{
  position:relative;width:var(--btn);height:var(--btn);border-radius:50%;border:0;flex:0 0 auto;
  background:#8e9198;color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:transform .15s,background .15s;
}
/* 只扩大可点击热区，不改变按钮的视觉大小：用一个撑到按钮外面的透明伪元素接收点击，
   ::before 本身没有背景/内容，不会在视觉上让按钮看起来变大 */
.resize::before{content:"";position:absolute;inset:-6px}
.resize:active{transform:scale(.9);background:#75787f}
/* 常规态下 ⤢ 按钮也不出现，只有编辑态才能调尺寸 */
.phone:not(.editing) .resize{display:none}
.resize svg{width:54%;height:54%;display:block}

/* 拖拽态 */
.card.placeholder{
  opacity:.28;box-shadow:none;background:#dfe2e8;
}
.card.placeholder *{visibility:hidden}
/* 浮层现在挂在 .phone 内部（而不是 body 下），position:absolute 配合 .phone 自带的
   overflow:hidden，拖出手机边框时会被物理裁切掉，而不是把浮层的位置钳制在边框内 */
.ghost{
  position:absolute;left:0;top:0;z-index:9999;pointer-events:none;margin:0;
  box-shadow:0 14px 32px rgba(20,22,30,.22);border-radius:var(--radius);
  transform-origin:center;transition:none;
}
/* 孤立（未配对）的 1×0.5 卡片下方留白的半格槽位：不可见，但要能接住拖拽悬停/落点判定，
   否则拖到那片空白上会因为没有任何 DOM 元素而判定失败 */
.plan-A .card[data-size="1x0.5"] > .blank-hit,
.plan-B .card[data-size="1x0.5"] > .blank-hit{
  position:absolute;left:0;right:0;top:calc(100% + var(--gap));height:var(--unit);
}

/* ---- 方案 A：大卡片（2 列） ---- */
.plan-A{
  --cols:2; --gap:10px; --edge:10px; --card-h:120px; --pad:10px; --radius:18px;
  --ico:40px; --btn:24px; --fs-name:16px; --fs-sub:14px; --txt-mt:16px;
  --unit:calc((var(--card-h) + var(--gap)) / 2);
  /* 卡片尺寸占位：半格网格，只在方案 A 生效。每张卡片的 grid-column/grid-row
     由 JS 里的 relayout() 显式计算并写成行内样式（见 computeLayout()），
     不依赖浏览器自动排布——因为需要实现“孤立 1×0.5 卡片独占一整个 1×1 高度的
     槽位，只有紧跟着的下一张也是 1×0.5 才共享同一槽位；改尺寸时前面的卡片
     位置不变、后面的卡片顺势重排、且不回填跳过的空位”这套规则，纯 CSS 的
     auto-flow（不管 dense 还是稀疏）都无法精确表达。 */
  grid-auto-rows:var(--unit);
  row-gap:0;column-gap:var(--gap);
}
.plan-A .card{min-height:0;margin-bottom:var(--gap)}
.plan-A .card[data-size="1x0.5"]{
  flex-direction:row;align-items:center;justify-content:space-between;padding:0 var(--pad);
}
.plan-A .card[data-size="1x0.5"] .ico{display:none}
.plan-A .card[data-size="1x0.5"] .sub{display:none}
.plan-A .card[data-size="1x0.5"] .row1{flex:0 0 auto}
.plan-A .card[data-size="1x0.5"] .txt{margin-top:0;order:-1;flex:1 1 auto;min-width:0;margin-right:calc(var(--btn) + 6px)}
/* 1x0.5 没有背景色变化可以指示选中了，勾选圆圈挪到尺寸按钮左边、垂直居中，
   而不是像其他尺寸那样绝对定位在右下角（那个位置会跟这一档本来就贴右边的
   ⤢ 按钮撞在一起） */
.plan-A .card[data-size="1x0.5"] .check{
  top:50%;bottom:auto;right:calc(var(--pad) + var(--btn) + 6px);
  transform:translateY(-50%);
}
/* ?select=off：勾选圆圈本来就不占 flex 布局空间（absolute 定位），margin-right 里
   的 var(--btn) 那部分是特意给它让出来的，圆圈隐藏后这部分要还给设备名，只保留给
   ⤢ 按钮本身的 6px 间距（⤢ 按钮自己的宽度已经由 .row1 的 flex 尺寸单独占位，不需要
   算进这个 margin） */
.no-select .plan-A .card[data-size="1x0.5"] .txt{margin-right:6px}
/* 常规态下勾选圆圈和 ⤢ 按钮都不出现，这两部分预留空间都要还给设备名（不像
   ?select=off 那样只还勾选圆圈那一截），选择器比上面 .no-select 那条多一层，
   特异度更高，两者同时生效时这条赢，归零更彻底 */
.phone:not(.editing) .plan-A .card[data-size="1x0.5"] .txt{margin-right:0}
/* 2x1/2x2 共用同一套两行网格布局：图标 + 设备名/房间 + 尺寸按钮一行，
   状态控件独占下一行。改用 CSS Grid（而不是 flex-wrap + row-gap）是因为
   多行 flex 的 gap 在"某一行内容比预期更高"时会跟 align-content 的隐式
   stretch 相互影响，曾经导致行间距被吃掉、看起来像贴在一起。
   用 display:contents 把 .row1/.row2 拆开，让图标/文字/按钮/控件都变成
   .card 自己的网格项，再用 grid-row/grid-column 摆到两行。
   align-content:space-between 让两行分别贴齐卡片的上/下内边距（顶部紧跟
   padding、底部到卡片边缘固定还是 padding 那 10px，不会多出一截空白），
   卡片固定高度和内容实际高度之间的差值全部转成中间这一条间距，自适应
   撑开——这是 2x1 卡片高度不随控件类型变化、但不同控件本身高度不一致时
   唯一能保证"上贴顶、下贴底"的写法；2x2 有独立的 1fr 行吃掉剩余高度，
   这里不会有多余空间可分配，align-content 对它是无效果的 */
:is(.plan-A, .plan-B) .card[data-size="2x1"],
:is(.plan-A, .plan-B) .card[data-size="2x2"]{
  display:grid;grid-template-columns:auto 1fr auto;align-content:space-between;
  column-gap:10px;row-gap:12px;
}
:is(.plan-A, .plan-B) .card[data-size="2x1"] .row1,
:is(.plan-A, .plan-B) .card[data-size="2x2"] .row1,
:is(.plan-A, .plan-B) .card[data-size="2x1"] .row2,
:is(.plan-A, .plan-B) .card[data-size="2x2"] .row2{display:contents}
:is(.plan-A, .plan-B) .card[data-size="2x1"] .ico,
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ico{grid-row:1;grid-column:1;align-self:start}
:is(.plan-A, .plan-B) .card[data-size="2x1"] .txt,
:is(.plan-A, .plan-B) .card[data-size="2x2"] .txt{grid-row:1;grid-column:2;margin-top:0;min-width:0;align-self:start}
:is(.plan-A, .plan-B) .card[data-size="2x1"] .resize,
:is(.plan-A, .plan-B) .card[data-size="2x2"] .resize{grid-row:1;grid-column:3;align-self:start}
:is(.plan-A, .plan-B) .card[data-size="2x1"] .ctrl{
  grid-row:2;grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;
}
/* 步进器（目前只有空调）按钮/数值间距更大，跟开关/进度条这类控件区分开——
   用 :has(.step) 只命中含步进器的 .ctrl，不影响同一档位下其他设备的控件行。
   之前这里还写死过 height:32px，但 .step 按钮本身早已改成 40px 高
   （"按钮改成40高"那次改动漏改了这一处），40px 的按钮被强行塞进 32px 的
   容器、垂直居中溢出，多出的部分会顶穿网格算出来的行高，就是"卡片底部
   凑不够 10px"的根因——容器不再定死高度，交给 flex 按 .step 实际的
   40px 自然撑开就不会有这个偏差 */
:is(.plan-A, .plan-B) .card[data-size="2x1"] .ctrl:has(.step){gap:16px}
/* Smart Hub 只到 2x1 档（无 2x2），存储条+事件图标改成同一行左右并排，不再上下堆叠：
   2x1 卡片内容区高度固定只有 100px，头部行占 40px，控件行最多只有 60px 预算，而
   "40px 存储条 + 10px 间距 + 事件图标另起一行"需要 78px+，装不下，会撑破卡片底部
   （见 DESIGN.md 对应章节）。改成同一行后总高度就是条形本身的 40px，稳稳落在预算内，
   条形图/事件图标的样式都写在上面 base 规则里，不分档位 */
:is(.plan-A, .plan-B) .card[data-size="2x1"] .ctrl:has(.events){gap:10px}
/* 2x2：横向+纵向空间都翻倍，状态控件放大一档；网格第二行设为 1fr 吃掉
   卡片剩余高度，.ctrl 默认拉伸铺满这一行，靠 align-items:flex-end 让内容
   贴在这行的底部，视觉效果等同"推到卡片底部" */
:is(.plan-A, .plan-B) .card[data-size="2x2"]{grid-template-rows:auto 1fr}
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ctrl{
  grid-row:2;grid-column:1/-1;display:flex;align-items:flex-end;gap:10px;
}
/* 摄像头 2x2：不显示开关/进度条这类状态控件，改成一块填满剩余高度的监控画面预览，
   贴合参考截图里"标题行下方是一整块画面预览"的布局——.ctrl 本身已经靠
   grid 的 1fr 行铺满剩余高度，这里只需让它纵向拉伸（而不是贴底）就够了。
   图片是用户提供的真实照片压缩后转成 base64 内嵌（单文件、无外部依赖的约定不变，
   只是这一处从纯 CSS 渐变换成了真实图片）；background-size:cover 等比缩放铺满、
   多余部分居中裁掉，不会被拉伸变形 */
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ctrl:has(.cam){align-items:stretch}

/* 扫地机 2x2：状态摘要+任务网格纵向拉伸铺满，跟摄像头/灯的 2x2 处理是同一个模式 */
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ctrl:has(.vacuumpanel){align-items:stretch}
/* 灯类设备 2x2：亮度条（数值在条内） + White/Color 分段控件 + 色谱面板竖向堆叠，
   色谱面板 flex:1 吃掉剩余高度撑满卡片底部，跟摄像头 2x2 的 .cam 是同一思路 */
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ctrl:has(.lspectrum){flex-direction:column;align-items:stretch;gap:10px}
/* .barlabel 的 flex:1 1 auto 是给横向的 2x1 行布局用的（撑满行宽，高度另由 height:40px 锁死，
   互不冲突）；这里容器改成纵向堆叠后同一个 flex:1 1 auto 会让亮度条也跟着色谱面板抢纵向剩余
   空间，把条形撑高到 40px 以上，必须单独锁回 flex:0 0 auto，只让色谱面板一个人吃剩余高度 */
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ctrl:has(.lspectrum) .barlabel{flex:0 0 auto}
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ctrl:has(.lspectrum) .lmode{display:flex}
:is(.plan-A, .plan-B) .card[data-size="2x2"] .ctrl:has(.lspectrum) .lspectrum{display:block;flex:1 1 auto;min-height:0}
/* ---- 方案 B：列表卡片样式跟方案 A 完全一致——两套方案只在"切换卡片尺寸"这一个
   交互上有差异（方案 A 直接循环点击，方案 B 弹出底部面板选择），拖拽排序和列表
   卡片本身的视觉规格没有任何区别，所以这里的变量值直接抄 .plan-A 那一份 ---- */
.plan-B{
  --cols:2; --gap:10px; --edge:10px; --card-h:120px; --pad:10px; --radius:18px;
  --ico:40px; --btn:24px; --fs-name:16px; --fs-sub:14px; --txt-mt:16px;
  --unit:calc((var(--card-h) + var(--gap)) / 2);
  grid-auto-rows:var(--unit);
  row-gap:0;column-gap:var(--gap);
}
.plan-B .card{min-height:0;margin-bottom:var(--gap)}
.plan-B .card[data-size="1x0.5"]{
  flex-direction:row;align-items:center;justify-content:space-between;padding:0 var(--pad);
}
.plan-B .card[data-size="1x0.5"] .ico{display:none}
.plan-B .card[data-size="1x0.5"] .sub{display:none}
.plan-B .card[data-size="1x0.5"] .row1{flex:0 0 auto}
.plan-B .card[data-size="1x0.5"] .txt{margin-top:0;order:-1;flex:1 1 auto;min-width:0;margin-right:calc(var(--btn) + 6px)}
.plan-B .card[data-size="1x0.5"] .check{
  top:50%;bottom:auto;right:calc(var(--pad) + var(--btn) + 6px);
  transform:translateY(-50%);
}
/* ?select=off：理由同 .plan-A 那条同名规则 */
.no-select .plan-B .card[data-size="1x0.5"] .txt{margin-right:6px}
/* 理由同方案 A 那条同名规则 */
.phone:not(.editing) .plan-B .card[data-size="1x0.5"] .txt{margin-right:0}
/* 2x1/2x2 的网格结构、.ctrl 展示/布局规则改用上面 :is(.plan-A, .plan-B) 的共用规则，
   方案 B 现在会显示跟方案 A 完全同款的步进器/进度条/门锁信息/扫地机任务网格等内容——
   两个方案的列表卡片视觉规格没有任何区别，唯一差异只在切换尺寸的交互方式 */

/* ========== toast ========== */
/* toast 显示在触发它的悬浮菜单（.batch-bar）正上方，不固定停在页面底部——位置靠
   --toast-left/--toast-bottom 这两个 JS 写入的 CSS 变量单独控制，滑入/滑出动效的
   translateY 分离出来，两者互不干扰 */
.toast{
  position:fixed;left:var(--toast-left,50%);bottom:var(--toast-bottom,44px);
  transform:translateX(-50%) translateY(16px);
  background:rgba(28,29,33,.92);color:#fff;font-size:13px;
  padding:11px 20px;border-radius:22px;z-index:99999;
  opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== 就近提示气泡（点了不支持切换的尺寸按钮时） ========== */
.hint{
  position:fixed;z-index:99999;pointer-events:none;max-width:220px;
  background:rgba(28,29,33,.92);color:#fff;font-size:13px;line-height:1.4;
  padding:11px 16px;border-radius:14px;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;
}
.hint.show{opacity:1;transform:translateY(0)}
.hint::after{
  content:"";position:absolute;left:var(--arrow-left,50%);bottom:-6px;
  width:12px;height:12px;background:inherit;
  clip-path:polygon(0 0,100% 0,50% 100%);
}

/* ========== 移动端 ========== */
@media (max-width:760px){
  body{padding:12px 0 40px;background:#f5f6f8}
  .topbar{padding:0 16px}
  .phone{width:100vw;height:auto;min-height:calc(100vh - 150px);border-radius:0;box-shadow:none;overflow:visible}
  .phone .notch{display:none}
  .stage{gap:16px;width:100%}
  .cmp-only{display:none!important}
  /* 移动端 .phone 高度变成 auto、随内容撑高，不再是"吸底"这个 absolute 定位
     所依赖的固定高度容器；改成 position:fixed 直接锚定浏览器视口底部，
     不然 .batch-bar 会跟着 .phone 的总高度走，看起来像跟随列表内容滚动 */
  .batch-bar{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom))}
  /* 底部选尺寸面板是同一类问题：.sheet-mask/.sheet 桌面端靠 .phone 的 overflow:hidden
     天然裁在框内、absolute 定位相对 .phone 没问题；移动端 .phone 变成 overflow:visible
     + 高度随内容撑高后，遮罩/面板的 inset:0 / bottom:0 就不再对齐视口，而是对齐到
     "整个列表内容的末尾"。改成 position:fixed 直接相对浏览器视口定位，面板本身依旧
     贴视口底部（不像 .batch-bar 那样悬浮离底 24px，它是通栏面板，天然应该贴到底） */
  .sheet-mask{position:fixed}
  .sheet{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  /* 移动端 .phone 撑满 100vw，这里的视口坐标等于"手机屏幕"坐标。toast 用
     left:0;right:0 + margin:0 auto 水平居中、width:max-content 让盒子按内容自然
     宽度算，max-width 只在文案长到超出屏幕左右各 16px 边距时才封顶转而换行，
     短文案正常收缩，不会被强行撑满或裁成两行（过程见 CHANGELOG.md「第二十四轮」
     及其两次同日修正） */
  .toast{left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);text-align:center;transform:translateY(16px)}
  .toast.show{transform:translateY(0)}
}
</style>

/* sizes：该设备类型支持切换到的尺寸集合（宽x高，单位=半格），顺序不重要，

/* ---------- 渲染一台手机 ---------- */
function cardHTML(d, i){

      <div class="lspectrum"></div>`;
  } else if(d.ctrl === "lock"){
    inner = `<div class="lockinfo">
      <div class="lockrow">${CLOCK_ICON}<span>Last operation: ${d.lastOp}</span></div>
      <div class="lockrow">${ICONS.lock}<span>${d.state}</span><i class="lockdiv"></i>${DOOR_ICON}<span>${d.doorState}</span></div>
    </div>`;
  } else if(d.ctrl === "vacuum"){
    const tasks = (d.tasks || []).map(t => `<div class="vtask">${TASK_ICONS[t.icon] || ""}<span>${t.label}</span></div>`).join("");
    inner = `<div class="vacuumpanel">
      <div class="vstatus">${ZZZ_ICON}<span>${d.state}</span></div>
      <div class="vtasks">${tasks}</div>
    </div>`;
  }
  const ctrl = inner ? `<div class="ctrl">${inner}</div>` : "";
  return `<div class="card" data-i="${i}" data-size="1x1">
    <div class="row1">
      <div class="ico">${ICONS[d.icon] || ICONS.bulb}</div>
      <button class="resize" aria-label="Resize">${RESIZE_ICON}</button>
    </div>
    <div class="row2">
      <div class="txt">
        <div class="name">${d.name}</div>
        <div class="sub">${d.sub}${d.battery != null ? `<span class="sub-batt">${BATTERY_ICON}${d.battery}%</span>` : (d.battIcon ? `<span class="sub-batt">${BATTERY_ICON}</span>` : "")}</div>
      </div>
      ${ctrl}
    </div>
    <div class="check">✓</div>
  </div>`;
}

function phone(plan){
  const wrap = document.createElement("div");
  wrap.className = "phone-wrap";
  wrap.innerHTML = `
    <div class="phone">
      <div class="notch"></div>
      <div class="phone-head">
        <div class="navbar">
          <span class="act">Cancel</span>
          <span class="title">Home Page</span>
          <span class="act done">Done</span>
        </div>
      </div>
      <div class="screen">
        <div class="grid plan-${plan}">${DEVICES.map(cardHTML).join("")}</div>
      </div>
      <div class="batch-bar">
        <button data-act="share"><span class="bico">${SHARE_ICON}</span><span class="blabel">Share</span></button>
        <button data-act="fav"><span class="bico">${FAV_ICON}</span><span class="blabel">Favorite</span></button>
        <button data-act="room"><span class="bico">${ROOM_ICON}</span><span class="blabel">Move Room</span></button>
      </div>
      <div class="sheet-mask"></div>
      <div class="sheet">
        <div class="sheet-head">
          <button class="sheet-close" aria-label="Close">${CLOSE_ICON}</button>
          <span class="sheet-title">Select the card view for your device</span>
        </div>
        <div class="sheet-hint">Swipe left or right to preview other sizes</div>
        <div class="sheet-track"><div class="sheet-track-inner"></div></div>
        <div class="sheet-dots"></div>
        <button class="sheet-confirm">Use This Card View</button>
      </div>
    </div>`;

  const grid = wrap.querySelector(".grid");
  const phoneEl = wrap.querySelector(".phone");
  const titleEl = wrap.querySelector(".navbar .title");
  const doneEl = wrap.querySelector(".navbar .act.done");

  /* 常规态/编辑态状态机：常规态下卡片纯展示（不抖动、⤢/勾选圆圈隐藏），只有
     长按任意卡片（见 enableSort() 的 start()）才会进入编辑态。editSnapshot
     记录进入编辑态那一刻的排序+尺寸，Cancel 时用它整体还原，Done 则保留。
     markDirty() 标记"这次编辑态里真的发生过排序/尺寸改动"，驱动 Done 按钮的
     置灰/可点状态（见上方 CSS），调用点分散在三处会真正改动卡片的地方：方案 A
     的 ⤢ 循环切尺寸（下方 grid 的 click 监听）、方案 B 面板确认尺寸
     （openSheet() 的 onConfirm()）、拖拽换位（enableSort() 的 move()，跨函数
     调用走 phoneEl._markDirty，跟 _enterEditMode 同一种写法） */
  let editSnapshot = null;
  function markDirty(){ doneEl.classList.add("dirty"); }
  function enterEditMode(){
    if(phoneEl.classList.contains("editing")) return;
    editSnapshot = [...grid.children].map(c=>({i:c.dataset.i, size:c.dataset.size}));
    doneEl.classList.remove("dirty");
    phoneEl.classList.add("editing");
    titleEl.textContent = "Edit Cards";
  }
  function exitEditMode(commit){
    if(!phoneEl.classList.contains("editing")) return;
    grid.querySelectorAll(".card.selected").forEach(c=>c.classList.remove("selected"));
    wrap.querySelector(".batch-bar").classList.remove("show");
    if(!commit && editSnapshot){
      const snap = editSnapshot;
      flip(grid, ()=>{
        const byI = new Map([...grid.children].map(c=>[c.dataset.i, c]));
        snap.forEach(entry=>{
          const c = byI.get(entry.i);
          c.dataset.size = entry.size;
          grid.appendChild(c);
        });
        relayout(grid);
      });
    }
    editSnapshot = null;
    phoneEl.classList.remove("editing");
    titleEl.textContent = "Home Page";
  }
  phoneEl._enterEditMode = enterEditMode;   // enableSort() 闭包里跨函数调用，写法同下面 wrap._sheetCarousel
  phoneEl._markDirty = markDirty;           // enableSort()/openSheet() 闭包里跨函数调用，同上

  relayout(grid);
  enableJiggle(grid);
  enableSort(grid);
  enableBlankScroll(wrap.querySelector(".screen"));
  wrap.querySelector(".navbar .act:not(.done)").addEventListener("click", ()=>exitEditMode(false));
  wrap.querySelector(".navbar .act.done").addEventListener("click", ()=>exitEditMode(true));
  grid.addEventListener("click", e=>{
    const btn = e.target.closest(".resize"); if(!btn) return;
    if(!phoneEl.classList.contains("editing")) return;
    e.stopPropagation();
    const card = btn.closest(".card");
    if(plan === "B"){
      openSheet(wrap, grid, card, DEVICES[+card.dataset.i]);
      return;
    }

    const device = DEVICES[+card.dataset.i];
    const next = nextSize(card.dataset.size, device.sizes);
    if(next === card.dataset.size){ hintNear(btn, "This device doesn't support this size"); return; }
    markDirty();
    // 跟拖拽重排一样走 flip() 补位动画：被点的这张卡自己 skip 掉（尺寸变化
    // 直接瞬间呈现，给点击一个即时反馈），其余因为它变大/变小而被挤动位置
    // 的卡片平滑滑动过去，不再是整屏瞬移
    flip(grid, ()=>{
      card.dataset.size = next;
      relayout(grid);
    }, card);
  });
  wrap.querySelector(".batch-bar").addEventListener("click", e=>{
    const btn = e.target.closest("button"); if(!btn) return;
    const label = {share:"Share", fav:"Favorite", room:"Move Room"}[btn.dataset.act];
    toast(`Batch ${label}: not yet implemented`, btn.closest(".batch-bar"));
  });
  return wrap;
}

/* ---------- 桌面端空白区域拖拽模拟滚动 ----------
   移动端触摸滑动自带浏览器原生惯性滚动；桌面鼠标没有对应的原生"按住拖内容来滚动"
   手势，只认滚轮/滚动条。这里只在网格空白处（卡片间缝隙、上下留白）补一个鼠标拖拽
   换算成滚动的手势：只认 pointerType === "mouse"，且命中 .card 直接放弃处理，跟
   enableSort() 里"长按卡片才换位"的拖拽手势完全不重叠、互不干扰。
   实际滚动的容器分桌面/移动两种（跟 .phone-head 旁注释描述的滚动归属模型一致）：
   桌面下 .screen 自己是滚动容器；移动端 .screen 没有内部溢出，真正滚动的是
   document——按下瞬间用 scrollHeight/clientHeight 判断当前是哪种情况 */
function enableBlankScroll(screen){
  let dragging = false, startY = 0, startTop = 0, useWindow = false;
  screen.addEventListener("pointerdown", e=>{
    if(e.pointerType !== "mouse" || e.button !== 0) return;
    if(e.target.closest(".card")) return;
    dragging = true;
    startY = e.clientY;
    useWindow = screen.scrollHeight <= screen.clientHeight;
    startTop = useWindow ? window.scrollY : screen.scrollTop;
    screen.setPointerCapture(e.pointerId);
    screen.classList.add("blank-dragging");
  });
  screen.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const top = startTop - (e.clientY - startY);
    if(useWindow) window.scrollTo(0, top);
    else screen.scrollTop = top;
  });
  function stop(){
    if(!dragging) return;
    dragging = false;
    screen.classList.remove("blank-dragging");
  }
  screen.addEventListener("pointerup", stop);
  screen.addEventListener("pointercancel", stop);
}

/* 轮播式切尺寸：从当前档位往后找下一个该设备支持的档位，一圈找不到就原地不动 */
const SIZE_ORDER = ["1x0.5","1x1","2x1","2x2"];
function nextSize(current, supported){
  const start = SIZE_ORDER.indexOf(current);
  for(let k = 1; k <= SIZE_ORDER.length; k++){
    const cand = SIZE_ORDER[(start + k) % SIZE_ORDER.length];
    if(supported.includes(cand)) return cand;
  }
  return current;
}

/* ============================================================
   方案 B：点 ⤢ 弹出的底部尺寸选择面板。预览卡片用真实设备的数据
   （cardHTML 生成的同一份 DOM），套上跟外面网格同款的 .plan-B 三列
   网格变量 + grid-column/grid-row span，看起来就是这张卡片在方案 B
   网格里变成对应尺寸后的真实样子——不是另画一套占位 UI。
   轮播是"拖一下切一张"的 banner 手势，不是自由滚动，跟 enableSort()
   的长按拖拽换位是两套不同的交互模型，独立实现互不干扰。
   ============================================================ */
function buildPreviewCard(d, i, size){
  const div = document.createElement("div");
  div.innerHTML = cardHTML(d, i);
  const card = div.firstElementChild;
  card.dataset.size = size;
  const {w, h} = SIZE_WH[size] || {w:1, h:2};
  /* .sheet-grid 不再是 CSS Grid（面板只展示单张卡片，不需要列表那套
     多卡片共享网格轨道的机制），卡片宽高全靠 --pw/--ph 配合
     .sheet-grid .card 的 calc() 公式直接算出目标像素值，--ph 是
     SIZE_WH 里以半格为单位的高度 h 换算成"半个 d 档"的个数 */
  card.style.setProperty("--pw", w);
  card.style.setProperty("--ph", h / 2);
  return card;
}

function enableSheetCarousel(viewport, inner, dots, count, startIndex){
  // 切换阈值 0.18（划动距离占视口宽度比例）；同时加一个"快划"判定——哪怕距离没到
  // 阈值，只要划得够快（速度超过 FLICK_V）且方向明确（超过 FLICK_MIN 像素，排除
  // 误触/点击抖动），也当一次有效切换处理。
  const DAMP = 0.35, THRESHOLD = 0.18, FLICK_V = 0.5, FLICK_MIN = 24;
  let current = Math.min(Math.max(startIndex, 0), count - 1);
  let dragging = false, startX = 0, startTx = 0, dx = 0, startTime = 0;

  const dotEls = [...dots.children];
  function paintDots(){
    dotEls.forEach((d, i) => d.classList.toggle("active", i === current));
  }
  function settle(animate){
    inner.style.transition = animate ? "transform .28s cubic-bezier(.2,.8,.2,1)" : "none";
    inner.style.transform = `translateX(${-current * viewport.clientWidth}px)`;
    paintDots();
  }
  settle(false);

  function onDown(e){
    if(e.button != null && e.button !== 0) return;
    dragging = true; dx = 0;
    startX = e.clientX;
    startTx = -current * viewport.clientWidth;
    startTime = performance.now();
    inner.style.transition = "none";
    viewport.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    if(!dragging) return;
    dx = e.clientX - startX;
    const width = viewport.clientWidth;
    let raw = startTx + dx;
    const min = -(count - 1) * width, max = 0;
    if(raw > max) raw = max + (raw - max) * DAMP;
    if(raw < min) raw = min + (raw - min) * DAMP;
    inner.style.transform = `translateX(${raw}px)`;
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    const width = viewport.clientWidth;
    const elapsed = Math.max(1, performance.now() - startTime);
    const velocity = Math.abs(dx) / elapsed;
    const isFlick = Math.abs(dx) > FLICK_MIN && velocity > FLICK_V;
    const passedThreshold = Math.abs(dx) > width * THRESHOLD;
    if((passedThreshold || isFlick) && dx < 0 && current < count - 1) current++;
    else if((passedThreshold || isFlick) && dx > 0 && current > 0) current--;
    settle(true);
  }
  function onDotClick(e){
    const idx = dotEls.indexOf(e.target);
    if(idx === -1 || idx === current) return;
    current = idx;
    settle(true);
  }

  viewport.addEventListener("pointerdown", onDown);
  viewport.addEventListener("pointermove", onMove);
  viewport.addEventListener("pointerup", onUp);
  viewport.addEventListener("pointercancel", onUp);
  dots.addEventListener("click", onDotClick);

  return {
    current: () => current,
    destroy(){
      viewport.removeEventListener("pointerdown", onDown);
      viewport.removeEventListener("pointermove", onMove);
      viewport.removeEventListener("pointerup", onUp);
      viewport.removeEventListener("pointercancel", onUp);
      dots.removeEventListener("click", onDotClick);
    },
  };
}

function openSheet(wrap, grid, card, d){
  if(wrap._sheetCarousel){ wrap._sheetCarousel.destroy(); wrap._sheetCarousel = null; }

  const mask = wrap.querySelector(".sheet-mask");
  const sheet = wrap.querySelector(".sheet");
  const screen = wrap.querySelector(".screen");
  const track = wrap.querySelector(".sheet-track");
  const inner = wrap.querySelector(".sheet-track-inner");
  const dots = wrap.querySelector(".sheet-dots");
  const closeBtn = wrap.querySelector(".sheet-close");
  const confirmBtn = wrap.querySelector(".sheet-confirm");
  const sizes = d.sizes;
  const i = +card.dataset.i;

  inner.innerHTML = "";
  dots.innerHTML = "";
  sizes.forEach(size=>{
    const slide = document.createElement("div");
    slide.className = "slide";
    const sg = document.createElement("div");
    sg.className = "sheet-grid plan-B";
    sg.appendChild(buildPreviewCard(d, i, size));
    slide.appendChild(sg);
    const label = document.createElement("div");
    label.className = "slide-label";
    label.textContent = size.replace("x", "×");
    slide.appendChild(label);
    inner.appendChild(slide);
    dots.appendChild(document.createElement("span")).className = "dot";
  });

  /* 面板高度不该因为换了个只支持到 s/d/m 的设备就变矮——不管当前这个设备实际
     支持到哪档，面板高度都要按"2x2"来定，用户点不同品类时面板高度不能跳来跳去。
     预览卡片的高度是纯 CSS 公式算出来的固定值（跟设备内容无关，见 buildPreviewCard
     旁的注释），不需要真的让 2x2 变成这个设备"可选"的一档，塞一张不计入轮播/圆点
     的隐藏参照 slide 进来，靠它撑开 .sheet-track-inner 的 flex 自动高度即可——
     跟"矮档位靠同一行 flex 兄弟撑高"是完全一样的机制，只是这个兄弟不可见也点不到 */
  if(!sizes.includes("2x2")){
    const refSlide = document.createElement("div");
    refSlide.className = "slide slide-ref";
    refSlide.setAttribute("aria-hidden", "true");
    const refSg = document.createElement("div");
    refSg.className = "sheet-grid plan-B";
    refSg.appendChild(buildPreviewCard(d, i, "2x2"));
    refSlide.appendChild(refSg);
    const refLabel = document.createElement("div");
    refLabel.className = "slide-label";
    refLabel.textContent = "2×2";
    refSlide.appendChild(refLabel);
    inner.appendChild(refSlide);
  }

  const startIndex = Math.max(0, sizes.indexOf(card.dataset.size));
  const carousel = enableSheetCarousel(track, inner, dots, sizes.length, startIndex);
  wrap._sheetCarousel = carousel;

  function close(){
    mask.classList.remove("show");
    sheet.classList.remove("show");
    mask.removeEventListener("click", close);
    closeBtn.removeEventListener("click", close);
    confirmBtn.removeEventListener("click", onConfirm);
    carousel.destroy();
    if(wrap._sheetCarousel === carousel) wrap._sheetCarousel = null;
    /* 解除面板打开时加的滚动锁，见下方 mask.classList.add("show") 旁的注释 */
    screen.style.overflow = "";
    document.body.style.overflow = "";
  }
  function onConfirm(){
    const newSize = sizes[carousel.current()];
    if(newSize !== card.dataset.size){
      const phoneEl = wrap.querySelector(".phone");
      phoneEl._markDirty && phoneEl._markDirty();
    }
    // 跟方案 A 的 ⤢ 循环点击一样，跟拖拽重排共用 flip() 补位动画，skip 掉
    // 卡片自己（面板关闭后它直接呈现新尺寸），其余被挤动的卡片平滑滑过去
    flip(grid, ()=>{
      card.dataset.size = newSize;
      relayout(grid);
    }, card);
    close();
  }

  mask.addEventListener("click", close);
  closeBtn.addEventListener("click", close);
  confirmBtn.addEventListener("click", onConfirm);

  mask.classList.add("show");
  sheet.classList.add("show");
  /* 面板打开期间锁死背后列表的滚动能力：桌面端 .screen 自己是滚动容器（见
     .phone-head 旁的注释），锁它的 overflow 即可；移动端真正滚动的是 document，
     所以同时也锁 document.body——两者只有一个实际生效，同时锁不会冲突。对应的
     解锁在 close() 里；render() 切换视图整体替换 DOM 时也会顺带清掉 body 的锁，
     防止切视图时面板还开着导致锁泄漏（修复过程见 CHANGELOG.md「第二十三轮」） */
  screen.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
}

/* ============================================================
   方案 A 的占位算法：按列表顺序、半格（half-unit）为最小单位，
   摆放游标只前进不后退（不回填已跳过的格子）。
   1×0.5 特殊规则：单独一张时仍先按占满一个完整 1×1 高度的槽位来参与
   碰撞检测（下半格不会被后面任何卡片占用、也不会被跳过的格子回填）；
   只有列表里紧跟着它、中间没被别的卡片打断的下一张也是 1×0.5，两者
   才叠在一起共享这一个槽位。孤立时预留但没有卡片渲染进去的那半格，
   会在 relayout() 里被识别出来并把对应的网格行高度收缩成 0，视觉上
   不留空档——但这只是"显示收缩"，不影响上面这套占位/碰撞逻辑本身，
   后面卡片的落点该怎么算还是怎么算，不会因为收缩了显示高度就多塞
   一张卡片进去。
   ============================================================ */
const SIZE_WH = {
  "1x0.5":{w:1,h:1}, "1x1":{w:1,h:2}, "2x1":{w:2,h:2}, "2x2":{w:2,h:4},
};

function computeLayout(sizes, cols){
  const occupied = new Set();               // `${row}:${col}` 已占用的半格（含孤立 1×0.5 预留但不渲染的半格）
  const fits = (row, col, w, h)=>{
    if(col + w > cols) return false;
    for(let r = row; r < row + h; r++)
      for(let c = col; c < col + w; c++)
        if(occupied.has(`${r}:${c}`)) return false;
    return true;
  };
  const occupy = (row, col, w, h)=>{
    for(let r = row; r < row + h; r++)
      for(let c = col; c < col + w; c++)
        occupied.add(`${r}:${c}`);
  };
  // 摆放游标：只按行优先顺序前进（同一行先列 0 后列 1，再换下一行……），
  // 从游标位置开始往后找第一个放得下的格子，绝不回头找更早被跳过的格子。
  let curRow = 0, curCol = 0;
  const findSlot = (w, h)=>{
    let row = curRow, col = curCol;
    while(!fits(row, col, w, h)){
      col++;
      if(col >= cols){ col = 0; row++; }
    }
    return {row, col};
  };
  const advanceCursor = (row, col, w)=>{
    curRow = row; curCol = col + w;
    if(curCol >= cols){ curCol = 0; curRow = row + 1; }
  };

  const positions = new Array(sizes.length);
  for(let i = 0; i < sizes.length; i++){
    if(sizes[i] === "1x0.5"){
      const paired = sizes[i+1] === "1x0.5";
      const {row, col} = findSlot(1, 2);       // 不管配不配对，都先占满一整个槽位
      occupy(row, col, 1, 2);
      positions[i] = {row, col, w:1, h:1};
      advanceCursor(row, col, 1);
      if(paired){
        positions[i+1] = {row:row+1, col, w:1, h:1};
        i++;                                    // 下一张已经在这里排完了，跳过
      }
    } else {
      const {w, h} = SIZE_WH[sizes[i]];
      const {row, col} = findSlot(w, h);
      occupy(row, col, w, h);
      positions[i] = {row, col, w, h};
      advanceCursor(row, col, w);
    }
  }

  // 找出真正"渲染出来的"半格行（区别于上面 occupied 里含预留但不渲染的半格）：
  // 只要有一张卡片实际画进了这一行（不管哪一列），这一行的显示高度就保留；
  // 一行两列都没有任何卡片实际落在这里（只是孤立 1×0.5 的预留空位），
  // 才会在 relayout() 里被收缩成 0 高度。
  const rendered = new Set();
  positions.forEach(p=>{
    for(let r = p.row; r < p.row + p.h; r++)
      for(let c = p.col; c < p.col + p.w; c++)
        rendered.add(`${r}:${c}`);
  });
  let maxRow = -1;
  positions.forEach(p=> maxRow = Math.max(maxRow, p.row + p.h - 1));
  const rowUsed = [];
  for(let r = 0; r <= maxRow; r++){
    let used = false;
    for(let c = 0; c < cols; c++) if(rendered.has(`${r}:${c}`)) used = true;
    rowUsed.push(used);
  }

  return { positions, rowUsed };
}

function relayout(grid){
  const cards = [...grid.children];
  const sizes = cards.map(c => c.dataset.size);
  const cols = parseInt(getComputedStyle(grid).getPropertyValue('--cols')) || 2;
  const {positions, rowUsed} = computeLayout(sizes, cols);
  const pairStart = computePairs(sizes);

  // 孤立 1×0.5 卡片下方预留但没有任何卡片渲染进去的半格行，把行高收缩成 0，
  // 视觉上不留空档；真正有卡片落进去的行保持原本的半格高度
  grid.style.gridTemplateRows = rowUsed.length
    ? rowUsed.map(used => used ? "var(--unit)" : "0px").join(" ")
    : "";

  cards.forEach((card, i)=>{
    const p = positions[i];
    card.style.gridColumn = `${p.col + 1} / span ${p.w}`;
    card.style.gridRow = `${p.row + 1} / span ${p.h}`;

    // 孤立（没配对）的 1×0.5 卡片下方留白槽位：补一个不可见的占位块用来接住拖拽判定，
    // 一旦这张卡配对成功或者变了尺寸，占位块要跟着撤掉
    const lone05 = sizes[i] === "1x0.5" && pairStart[i] === -1;
    const hit = [...card.children].find(c => c.classList.contains("blank-hit"));
    if(lone05 && !hit){
      const spacer = document.createElement("div");
      spacer.className = "blank-hit";
      card.appendChild(spacer);
    } else if(!lone05 && hit){
      hit.remove();
    }
  });
}

// 给每张卡片的抖动动画随机一份时长/负延迟：负 delay 等于让动画从周期中间的随机
// 相位直接起播，不用真的等那么久，卡片一出现就已经互相错开，不会先同步转一轮
// 再散开。只需要在卡片创建时设一次，relayout() 只改 gridColumn/gridRow，不会
// 覆盖这里设的内联样式，不用每次重排后重新随机
function enableJiggle(grid){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  [...grid.children].forEach(card=>{
    const dur = 0.22 + Math.random() * 0.1;
    card.style.animationDuration = dur + "s";
    card.style.animationDelay = (-Math.random() * dur) + "s";
  });
}

/* 找出当前列表里实际配成对的 1×0.5：pairStart[i] 是这张卡所在配对里第一张的下标，
   落单（含未配对的 1×0.5）则是 -1。判定逻辑必须和 computeLayout() 完全一致，
   否则拖拽时判断的配对关系会跟实际渲染出来的槽位对不上。 */
function computePairs(sizes){
  const pairStart = new Array(sizes.length).fill(-1);
  for(let i = 0; i < sizes.length; i++){
    if(sizes[i] === "1x0.5" && sizes[i+1] === "1x0.5"){
      pairStart[i] = i; pairStart[i+1] = i;
      i++;
    }
  }
  return pairStart;
}

/* el 是 m/l（占满整行宽度）时专用：棋盘固定只有两列，m/l 自己也总是占满整行，
   横坐标完全不用参与判断，只要触点的纵坐标落在哪一条"行带"里，那条行带就是
   换位目标——不管这一行实际是两张 d 并排、d + 一对堆叠的 s、还是干脆只有一侧
   有卡片另一侧彻底空着，统统是同一种情况，不用再分"干净整行"和"单侧空白"
   两套判定，也不用依赖 elementFromPoint 命中 DOM 元素（那一侧真空着时根本没有
   元素可命中）。
   做法：把每张卡片按它占的半格行区间 [row, row+h) 做区间合并——区间有重叠
   （同一行跨列）就并成同一条带，一路合并到某条带的纵向range 盖住 y 为止。
   返回这条带涉及的卡片，按下标升序（即 DOM 原有顺序）排列——算法保证同一行里
   col0 的内容必然比 col1 的内容先出现在列表里，这样换位后不会颠倒行内左右顺序。
   触点落在网格最外沿以外、或者算出来的行带就是 el 自己所在的那一条，都返回
   null，交给调用方直接放弃这次判定。
   每条带的命中范围不是贴着卡片自己的渲染矩形（unionRect 只包含卡片本身，不
   包含 margin/gap 造成的行间距）——否则相邻两条带之间会天然留一条够不到
   任何一条带的"缝隙死区"，触点落在这条缝里时两条带的 [top,bottom] 都框不住，
   判定直接失败。修正：命中范围延伸到与相邻带的中点为止（只对齐相邻带之间，
   不越过整个网格最外沿），纵向上完全无缝覆盖，不会再有夹在中间打不到的 y。 */
function computeRowBand(kids, positions, y){
  const order = positions.map((_, i) => i).sort((a, b) => positions[a].row - positions[b].row);
  const bands = [];
  let band = null, bandEnd = -Infinity;
  order.forEach(i=>{
    const p = positions[i];
    if(band && p.row < bandEnd){
      band.push(i);
      bandEnd = Math.max(bandEnd, p.row + p.h);
    } else {
      band = [i];
      bands.push(band);
      bandEnd = p.row + p.h;
    }
  });

  const groups = bands.map(group => group.sort((a, b) => a - b).map(i => kids[i]));
  const rects = groups.map(cards => unionRect(cards));

  for(let i = 0; i < groups.length; i++){
    const top = i === 0 ? rects[i].top : (rects[i - 1].bottom + rects[i].top) / 2;
    const bottom = i === groups.length - 1 ? rects[i].bottom : (rects[i].bottom + rects[i + 1].top) / 2;
    if(y >= top && y <= bottom) return groups[i];
  }
  return null;
}

/* 排布算法的游标只前进不回退：一张卡片如果在当前行的另一列放不下（比如后面
   紧跟着一张 m/l，两列都放不下就整个挪到下一行），那一列在这一行就会永久
   空着——没有任何 DOM 元素代表这片空白，elementFromPoint 天然命中不到。
   这个函数按算法真实算出来的网格坐标兜底：找出"这一行只有一侧列有卡片、
   另一侧彻底没有任何卡片渲染进去"的那些行，只要触点落在这一行的高度范围内
   （不分左右列），就算命中这一行仅有的那张卡片（如果是一对 s，就命中配对
   里的第一张，后续 unitOf() 会按配对规则把它还原成整对）。 */
function findRowGapTarget(grid, kids, positions, pairStart, x, y){
  const g = grid.getBoundingClientRect();
  if(x < g.left || x > g.right) return null;

  const seen = new Set();
  for(let i = 0; i < positions.length; i++){
    if(seen.has(i)) continue;
    const p = positions[i];
    if(p.w !== 1) continue;                 // 已经占满整行宽度的卡片（m/l）不存在这个问题

    let unit = [i], row0 = p.row, h = p.h;
    if(p.h === 1){
      if(pairStart[i] === -1) continue;      // 孤立没配对的 s：垂直方向的空白另有 .blank-hit 处理
      unit = [pairStart[i], pairStart[i] + 1];
      row0 = positions[unit[0]].row; h = 2;
    }
    unit.forEach(idx => seen.add(idx));

    const otherCol = p.col === 0 ? 1 : 0;
    let alone = true;
    for(let j = 0; j < positions.length; j++){
      if(unit.includes(j)) continue;
      const q = positions[j];
      if(q.col <= otherCol && otherCol < q.col + q.w && q.row < row0 + h && row0 < q.row + q.h){
        alone = false; break;
      }
    }
    if(!alone) continue;

    const r = unionRect(unit.map(idx => kids[idx]));
    if(y >= r.top && y <= r.bottom) return kids[unit[0]];
  }
  return null;
}

// 一张卡片所属的"最小可移动单位"：配对中的 1×0.5 要整体一起移动，其余卡片就是它自己
function unitOf(card, pairStart, kids){
  const idx = kids.indexOf(card);
  const ps = pairStart[idx];
  return ps === -1 ? [card] : [kids[ps], kids[ps + 1]];
}

// 几张卡片（1~2 张）的外接矩形，用来把"拖到配对上"的判定热区扩大到整个槽位，
// 而不是被拖到某一半的那一小块区域上
function unionRect(cards){
  const rects = cards.map(c => c.getBoundingClientRect());
  const left = Math.min(...rects.map(r => r.left));
  const top = Math.min(...rects.map(r => r.top));
  const right = Math.max(...rects.map(r => r.right));
  const bottom = Math.max(...rects.map(r => r.bottom));
  return { left, top, right, bottom, width: right - left, height: bottom - top };
}

// 拖拽落点判定用的目标热区：配对（两张卡）用外接矩形；孤立的 1×0.5 卡片要把
// 它下方的 .blank-hit 预留半格也算进去——否则死区判定只按那张小卡片自己的可见
// 区域算，落点落在预留空白上（明明已经被 elementFromPoint 命中到了这张卡）却因为
// 死区判定用的矩形太小、直接被当成"落在边缘"而拒绝触发换位
function targetHitRect(overUnit){
  if(overUnit.length > 1) return unionRect(overUnit);
  const card = overUnit[0];
  const hit = [...card.children].find(c => c.classList.contains("blank-hit"));
  return hit ? unionRect([card, hit]) : card.getBoundingClientRect();
}

// 把 unitA、unitB 两组卡片（各 1~2 张，DOM 序）整体互换位置，两组内部的相对顺序不变
function swapUnits(grid, unitA, unitB){
  const markerA = document.createComment("");
  const markerB = document.createComment("");
  grid.insertBefore(markerA, unitA[0]);
  grid.insertBefore(markerB, unitB[0]);
  unitA.forEach(c => grid.removeChild(c));
  unitB.forEach(c => grid.removeChild(c));
  unitB.forEach(c => grid.insertBefore(c, markerA));
  unitA.forEach(c => grid.insertBefore(c, markerB));
  grid.removeChild(markerA);
  grid.removeChild(markerB);
}

/* ============================================================
   拖拽排序：pointer events + FLIP 动画，鼠标 / 触屏通用
   ============================================================ */
const HOLD_MS = 350;   // 常规态下长按多久才会进入编辑态（同时开始拖拽这张卡片），更接近
                        // 真实 iOS "按住一会儿才会抖动"的手感，不会轻微多停留就意外进入
const DRAG_HOLD_MS = 180; // 已经在编辑态里时，长按卡片要多久才开始拖拽——比 HOLD_MS 短，
                        // 因为卡片已经在抖动、本来就是编辑态，不需要再等一个"确认要不要
                        // 进入编辑态"级别的长时间；哪条分支生效由下面 pointerdown 按下瞬间
                        // `.phone` 是否已经带 `.editing` 类决定（两档阈值的由来见
                        // CHANGELOG.md「第三十三轮」「第三十五轮」）
const MOVE_TOL = 6;    // 长按期间允许的手抖像素

const DEAD = 0.12;     // 目标卡片四周的死区比例，防止边界来回横跳；数值是按比例算的死区
                        // 边框，卡片越大死区的绝对像素就越宽，比例过大时大尺寸卡片（d/m/l）
                        // 要拖到接近正中央才能触发换位，收窄到 0.12 后手感正常
const SWAP_LOCK = 240; // 一次换位动画期间不再判定，单位 ms

const AUTOSCROLL_ZONE = 56;      // 指针距可视区域顶/底多近开始自动滚动，单位 px
const AUTOSCROLL_MAX_SPEED = 14; // 贴边时每帧最大滚动量，越靠近边缘越接近这个速度

function enableSort(grid){
  let timer = null, armed = false, active = false, lock = false;
  let el = null, ghost = null, sx = 0, sy = 0, ox = 0, oy = 0, bounds = null, scale = 1;
  let curX = 0, curY = 0, rafId = null, phoneRef = null, dragUsesWindow = false;
  const planClass = [...grid.classList].find(c => c.startsWith("plan-"));
  const cols = parseInt(getComputedStyle(grid).getPropertyValue('--cols')) || 2;
  const screenEl = grid.closest(".screen");
  const phoneHeadEl = grid.closest(".phone").querySelector(".phone-head");

  grid.addEventListener("pointerdown", e=>{
    if(e.button != null && e.button !== 0) return;
    if(e.target.closest(".resize")) return;
    const card = e.target.closest(".card"); if(!card) return;

    el = card; sx = e.clientX; sy = e.clientY; armed = true;
    const alreadyEditing = card.closest(".phone").classList.contains("editing");
    timer = setTimeout(()=>start(e.clientX, e.clientY), alreadyEditing ? DRAG_HOLD_MS : HOLD_MS);
  });

  function start(x, y){
    if(!el) return;
    active = true; armed = false; lock = false;
    // 长按期间手指/鼠标通常是静止的，start() 触发时还没有任何 pointermove 发生过，
    // curX/curY 会停留在上一次拖拽结束时的旧坐标（页面刚加载后首次拖拽则是初始值
    // 0,0）。下面紧接着 requestAnimationFrame(autoScrollTick) 会在第一帧就用这个
    // 坐标判断是否贴边、以及调用 move() 重新摆放浮层——不在这里同步成当前真实坐标，
    // 第一帧就会拿着错误坐标把浮层瞬移到错误位置（常见表现：刚长按进入编辑态开始
    // 拖拽，卡片瞬间飞到屏幕左上角之外）
    curX = x; curY = y;
    const r = el.getBoundingClientRect();
    ox = x - r.left; oy = y - r.top;
    const phone = el.closest(".phone");
    // 常规态下长按任意卡片：先进入编辑态（标题/抖动/⤢/勾选圆圈一起出现），
    // 再继续走下面的逻辑直接开始拖拽这张卡片——跟 iOS 桌面图标长按同时
    // "进入抖动编辑态 + 开始拖着这个图标走"一致；已经在编辑态时调用这个
    // 函数会被它内部的早退逻辑跳过，不会重复截取 Cancel 用的还原快照
    phone._enterEditMode && phone._enterEditMode();
    bounds = phone.getBoundingClientRect();
    // .ghost 挂在 .phone 内部，会连带被 .phone 的 transform:scale（PC 端模拟手机
    // 观感那条规则，见 CSS）再缩放一轮；getBoundingClientRect 量出来的都是缩放后
    // 的屏幕像素，直接拿来当 .ghost 自己的 width/height/translate 会被二次缩放，
    // 导致浮层比真实卡片小一圈、跟手位移也慢半拍。除以当前缩放比例换算回
    // .phone 自己的本地坐标系（未缩放前的 340 宽度那套坐标），移动端 scale 恒为
    // 1，这段换算等于不生效，不需要区分平台单独处理
    scale = bounds.width / phone.offsetWidth;
    // 整次拖拽手势开始时就固定住滚动归属（跟后面 autoScrollTick 共用同一个值，
    // 不逐帧重新判断）：移动端整页滚动模式下 .phone 没有 transform、但自身
    // overflow:visible、高度 auto——如果浮层按"相对 .phone 本地坐标"定位，
    // 自动滚动时每次重新量 bounds 都会让浮层在 .phone 内部的本地偏移跟着
    // 页面已滚动的距离一起增大，而 overflow:visible 会把这块越冲越远的浮层
    // 计入文档整体高度，形成"滚得越多、可滚动范围被撑得越大"的死循环，
    // 实测会导致自动滚动永远到不了列表真正的底部。桌面端 .phone 有缩放
    // transform，天然是 position:fixed 后代的新包含块，这条分支不受影响
    dragUsesWindow = screenEl.scrollHeight <= screenEl.clientHeight;

    // 浮层是"外层定位容器（.ghost）+ 里面一张卡片克隆"两层结构：
    // 外层负责跟手位移/裁切，卡片克隆负责视觉样式——两者不能是同一个元素，
    // 否则 .plan-A .card[...] 这类后代选择器（.plan-A 和 .card 分别在外层/卡片上）
    // 会因为外层同时套了 .plan-A 和 .card 两个类、缺少真正的祖先-后代关系而失效，
    // 表现为拖拽时 1×0.5 卡片"跳变"回默认的 1×1 样式。
    ghost = document.createElement("div");
    ghost.className = "ghost";
    if(planClass) ghost.classList.add(planClass);   // 撑起 CSS 变量，也让 .plan-A .card 系列规则能命中里面的克隆卡片
    ghost.style.width = (r.width / scale) + "px";
    ghost.style.height = (r.height / scale) + "px";

    const ghostCard = el.cloneNode(true);
    ghostCard.style.width = "100%";
    ghostCard.style.height = "100%";
    ghostCard.style.minHeight = "0";
    ghostCard.style.margin = "0";
    ghost.appendChild(ghostCard);

    if(dragUsesWindow){
      // 直接挂在 body 下、position:fixed 按纯视口坐标定位，跟 .phone 自身的
      // 滚动位置/overflow 完全脱钩，见上面的说明
      ghost.style.position = "fixed";
      document.body.appendChild(ghost);
      ghost.style.transform = `translate(${x - ox}px,${y - oy}px) scale(1.04)`;
    } else {
      // 浮层挂在 .phone 内部（不是 body 下）：配合 .phone 自带的 overflow:hidden，
      // 拖出手机边框的部分会被直接裁掉，而不是把浮层的位置钳制在边框以内
      const left0 = (r.left - bounds.left) / scale, top0 = (r.top - bounds.top) / scale;
      ghost.style.transform = `translate(${left0}px,${top0}px) scale(1.04)`;
      phone.appendChild(ghost);
    }
    el.classList.add("placeholder");
    document.body.classList.add("dragging");
    if(navigator.vibrate) navigator.vibrate(12);

    phoneRef = phone;
    rafId = requestAnimationFrame(autoScrollTick);
  }

  // 拖拽期间 document 的 touchmove 监听挡掉了原生触屏滚动（见下方），指针停在
  // 可视区域顶/底边缘时只能靠这个自调度的 rAF 循环持续滚动列表——光靠
  // pointermove 不够，手指按住不动贴在边缘时根本不会再触发新的 pointermove
  function autoScrollTick(){
    if(!active){ rafId = null; return; }
    let top, bottom;
    if(dragUsesWindow){
      top = phoneHeadEl ? phoneHeadEl.getBoundingClientRect().bottom : 0;
      bottom = window.innerHeight;
    } else {
      const r = screenEl.getBoundingClientRect();
      top = r.top; bottom = r.bottom;
    }

    let dy = 0;
    if(curY < top + AUTOSCROLL_ZONE){
      dy = -AUTOSCROLL_MAX_SPEED * (1 - Math.max(0, curY - top) / AUTOSCROLL_ZONE);
    } else if(curY > bottom - AUTOSCROLL_ZONE){
      dy = AUTOSCROLL_MAX_SPEED * (1 - Math.max(0, bottom - curY) / AUTOSCROLL_ZONE);
    }

    if(dy){
      if(dragUsesWindow) window.scrollBy(0, dy);
      else screenEl.scrollTop += dy;
      // 桌面端（.screen 自身滚动）浮层位移公式依赖 bounds，滚动后必须重新量一次，
      // 否则贴着边缘不动手指也会出现浮层跟内容一起滚走、脱离指针的情况；移动端
      // 浮层已经是 position:fixed 按纯视口坐标定位（见 start()），不依赖 bounds，
      // 不需要也不能在这里重新量 .phone 的 bounds（见 start() 里的说明）。
      // 滚动到头时浏览器本身会钳制 scrollTop/scrollBy，不用额外判断"是否还有更多内容"
      if(!dragUsesWindow && phoneRef){
        bounds = phoneRef.getBoundingClientRect();
        scale = bounds.width / phoneRef.offsetWidth;
      }
      if(ghost) move(curX, curY);
    }
    rafId = requestAnimationFrame(autoScrollTick);
  }

  function move(x, y){
    curX = x; curY = y;
    if(dragUsesWindow){
      ghost.style.transform = `translate(${x - ox}px,${y - oy}px) scale(1.04)`;
    } else {
      const left = (x - ox - bounds.left) / scale, top = (y - oy - bounds.top) / scale;
      ghost.style.transform = `translate(${left}px,${top}px) scale(1.04)`;
    }
    if(lock) return;                       // 换位动画没跑完，先不判定

    const kids = [...grid.children];
    const sizes = kids.map(c => c.dataset.size);
    const pairStart = computePairs(sizes);
    const isWide = el.dataset.size === "2x1" || el.dataset.size === "2x2";

    let over, overUnit;

    if(isWide){
      // m/l 占满整行宽度，不需要 elementFromPoint 命中具体某张卡片，直接按
      // 触点纵坐标找到目标行带（见 computeRowBand 注释）；行带天然就是换位
      // 单位，不存在"命中的那一张"和"应该整体换位的一整行"不一致的问题，
      // 单侧真空白的行也一并覆盖，不用再额外兜底。
      const { positions } = computeLayout(sizes, cols);
      const band = computeRowBand(kids, positions, y);
      if(!band || band.includes(el)) return;
      over = band[0];
      overUnit = band;
    } else {
      ghost.style.visibility = "hidden";
      const under = document.elementFromPoint(x, y);
      ghost.style.visibility = "";
      over = under && under.closest(".card");
      if(over && over.parentNode !== grid) over = null;

      if(!over){
        // elementFromPoint 在"这一行只有一侧列有卡片、另一侧列彻底没有任何卡片
        // 渲染进去"的真空白区域里找不到任何 DOM 元素可命中——这种空白跟孤立
        // 1×0.5 下方的预留半格不一样，没有 .blank-hit 占位块接着（那半格好歹
        // 是同一张卡片自己的预留区域，可以用 CSS 挂在卡片下方；这里是"另一整列"
        // 空着，没有一个天然归属的卡片可以挂占位块）。兜底：按算法真实算出来的
        // 网格坐标，反推这一行仅有的那张卡片（或那一对堆叠的 s），只要触点落在
        // 这一行的高度范围内（不分左右列），就算命中它。
        const { positions } = computeLayout(sizes, cols);
        over = findRowGapTarget(grid, kids, positions, pairStart, x, y);
      }
      if(!over || over === el) return;

      overUnit = unitOf(over, pairStart, kids);
    }

    if(overUnit.includes(el)){
      // 目标正是 el 自己配对的另一半：交换这两张卡片的上下顺序（同一个槽位内部换位），
      // 不是"忽略"——两张堆叠的 1×0.5 也应该能互相调换谁在上谁在下
      const r = over.getBoundingClientRect();
      const fx = (x - r.left) / r.width, fy = (y - r.top) / r.height;
      if(fx < DEAD || fx > 1 - DEAD || fy < DEAD || fy > 1 - DEAD) return;

      lock = true;
      el.closest(".phone")._markDirty?.();
      flip(grid, ()=>{
        const elIdx = kids.indexOf(el), overIdx = kids.indexOf(over);
        grid.insertBefore(el, elIdx < overIdx ? over.nextSibling : over);
        relayout(grid);
      }, el);
      setTimeout(()=>{ lock = false; }, SWAP_LOCK);
      return;
    }

    // 必须拖进目标区域中心才换位，边缘一圈是死区；目标如果是一对 1×0.5，
    // 热区按两张卡合并后的整个槽位算，孤立的 1×0.5 则连它下方预留的半格
    // 也一起算进热区（见 targetHitRect），不是只按那张小卡片自己的可见
    // 区域算，否则命中区域会小到很难拖准
    //
    // el 是 m/l 时横向不用这套逻辑：行带里如果只有一张卡（比如一行只有
    // 左列一张 d、右列真空白），targetHitRect 算出来的矩形只有那张卡自己
    // 半列宽，可实际热区（行带）是整行宽度——按半列宽算 fx，只要触点落在
    // 「空的那一侧」，fx 必然跑出 [0,1] 之外，被死区判定当成"拖到边缘"误
    // 挡掉，跟 README 里"整行不设左右死区"的规则矛盾。所以横向边界直接用
    // 这个 grid 自己的整行宽度，纵向仍然用行带的并集（跟非 wide 分支一致）。
    const r = isWide
      ? (() => {
          const g = grid.getBoundingClientRect(), band = unionRect(overUnit);
          return { left: g.left, width: g.width, top: band.top, height: band.height };
        })()
      : targetHitRect(overUnit);
    const fx = (x - r.left) / r.width, fy = (y - r.top) / r.height;
    if(fx < DEAD || fx > 1 - DEAD || fy < DEAD || fy > 1 - DEAD) return;

    // el 拖之前是不是配对里的一张：如果是，它被抽走以后搭档还会独占一整个槽位、
    // 不会像普通卡片那样腾出空间，所以不能沿用"往前拖插到目标前面、往后拖插到
    // 目标后面"那套按方向判断的位移规则，统一按"el 落到 over 的位置、over 顺势
    // 后移"处理，才会是 over 被挤到后一个槽位而不是抢到 el 让出的槽位
    const elWasPaired = pairStart[kids.indexOf(el)] !== -1;

    lock = true;
    el.closest(".phone")._markDirty?.();
    flip(grid, ()=>{
      if(overUnit.length > 1){
        // 目标是配对：被拖卡片和这一整对互换位置，不拆散目标配对插进中间
        swapUnits(grid, [el], overUnit);
      } else if(elWasPaired){
        grid.insertBefore(el, over);
      } else {
        // 普通插入式重排：只移动被拖卡片本身
        const kids2 = [...grid.children];
        const from = kids2.indexOf(el), to = kids2.indexOf(over);
        grid.insertBefore(el, from < to ? over.nextSibling : over);
      }
      relayout(grid);
    }, el);
    setTimeout(()=>{ lock = false; }, SWAP_LOCK);
  }

  function toggleSelect(card){
    card.classList.toggle("selected");
    const n = grid.querySelectorAll(".card.selected").length;
    const phoneEl = grid.closest(".phone");
    phoneEl.querySelector(".navbar .title").textContent = n > 0 ? `${n} Selected` : "Edit Cards";
    phoneEl.querySelector(".batch-bar").classList.toggle("show", n > 0);
  }

  function end(){
    // 没有触发过拖拽（armed 仍为 true 且 active 从未变 true）的一次干净点击，
    // 用来切换选中态；必须在下面重置 armed 之前先读一次
    const tapped = armed && el && !active ? el : null;
    clearTimeout(timer); armed = false; lock = false;
    if(active && ghost){
      const r = el.getBoundingClientRect();
      ghost.style.transition = "transform .2s cubic-bezier(.2,.7,.3,1)";
      ghost.style.transform = dragUsesWindow
        ? `translate(${r.left}px,${r.top}px) scale(1)`
        : `translate(${(r.left - bounds.left) / scale}px,${(r.top - bounds.top) / scale}px) scale(1)`;
      const g = ghost, e2 = el;
      setTimeout(()=>{ g.remove(); e2.classList.remove("placeholder"); }, 200);
    }
    ghost = null; el = null; active = false;
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    phoneRef = null;
    document.body.classList.remove("dragging");
    // 常规态下的纯点击不会经过 start()，不会进入编辑态，这里的 .editing 判断
    // 自然为 false；只有已经在编辑态时点击卡片才切换选中
    if(SELECT_ENABLED && tapped && tapped.closest(".phone").classList.contains("editing")) toggleSelect(tapped);
  }

  document.addEventListener("pointermove", e=>{
    if(armed && (Math.abs(e.clientX-sx) > MOVE_TOL || Math.abs(e.clientY-sy) > MOVE_TOL)){
      clearTimeout(timer); armed = false; el = null;   // 判定为滚动，放弃
      return;
    }
    if(active){ e.preventDefault(); move(e.clientX, e.clientY); }
  }, {passive:false});

  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
  // 拖拽中锁住页面滚动
  document.addEventListener("touchmove", e=>{ if(active) e.preventDefault(); }, {passive:false});
}

/* FLIP：让 grid 重排后的位移带上动画；skip 的元素直接瞬移（拖拽占位块不参与，
   否则它在动画途中的位置会干扰 elementFromPoint 命中判断）。
   位移用独立的 translate 属性而不是 transform:translate()——卡片自己还在用
   transform 之外的 rotate 属性做抖动动画，两者本来互不相干，但如果这里改用
   transform 会跟后续任何改成 transform 的动画再次冲突，统一用独立变换属性
   更稳妥 */
function flip(grid, mutate, skip){
  const items = [...grid.children];
  const first = items.map(i => i.getBoundingClientRect());
  mutate();
  items.forEach((it, idx)=>{
    if(it === skip) return;
    const last = it.getBoundingClientRect();
    const dx = first[idx].left - last.left, dy = first[idx].top - last.top;
    if(!dx && !dy) return;
    it.style.transition = "none";
    it.style.translate = `${dx}px ${dy}px`;
    requestAnimationFrame(()=>{
      it.style.transition = "translate .22s cubic-bezier(.2,.7,.3,1)";
      it.style.translate = "";
    });
  });
}

/* ---------- toast ---------- */
/* anchorEl 传入时，toast 定位到它正上方水平居中（给悬浮菜单点击用）；
   不传时退回页面底部居中的旧行为 */
let tTimer;
function toast(msg, anchorEl){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  if(anchorEl){
    const r = anchorEl.getBoundingClientRect();
    t.style.setProperty("--toast-left", (r.left + r.width / 2) + "px");
    t.style.setProperty("--toast-bottom", (window.innerHeight - r.top + 10) + "px");
  } else {
    t.style.removeProperty("--toast-left");
    t.style.removeProperty("--toast-bottom");
  }
  clearTimeout(tTimer);
  tTimer = setTimeout(()=>t.classList.remove("show"), 2000);
}

/* ---------- 就近提示气泡：紧贴触发它的按钮上方弹出，且跟随列表滚动 ---------- */
let hintEl, hintTimer, hintAnchor;
function positionHint(){
  if(!hintEl || !hintAnchor || !hintEl.classList.contains("show")) return;
  const phoneEl = hintAnchor.closest(".phone");
  const br = hintAnchor.getBoundingClientRect();
  const phone = phoneEl.getBoundingClientRect();

  // 按钮跟着列表滚出手机屏幕范围了，气泡跟着一起隐藏，别飘在外面
  if(br.bottom < phone.top || br.top > phone.bottom){
    hintEl.classList.remove("show");
    return;
  }
  const cx = br.left + br.width / 2;
  const hr = hintEl.getBoundingClientRect();
  let left = cx - hr.width / 2;
  left = Math.min(Math.max(left, phone.left + 8), phone.right - hr.width - 8);
  hintEl.style.left = left + "px";
  hintEl.style.top = (br.top - hr.height - 14) + "px";
  hintEl.style.setProperty("--arrow-left", (cx - left - 6) + "px");
}
document.addEventListener("scroll", positionHint, true);

function hintNear(anchor, msg){
  if(!hintEl){
    hintEl = document.createElement("div");
    hintEl.className = "hint";
    document.body.appendChild(hintEl);
  }
  hintAnchor = anchor;
  hintEl.textContent = msg;
  hintEl.classList.add("show");
  positionHint();
  clearTimeout(hintTimer);
  hintTimer = setTimeout(()=>hintEl.classList.remove("show"), 1800);
}

/* ---------- 视图切换 ---------- */
const stage = document.getElementById("stage");
function equalizeBatchBar(bar){
  const buttons = bar.querySelectorAll("button");
  buttons.forEach(b => b.style.width = "");
  const max = Math.max(...Array.from(buttons, b => b.offsetWidth));
  buttons.forEach(b => b.style.width = max + "px");
}
function render(view){
  document.body.style.overflow = ""; /* 防止切视图时方案 B 面板还开着，滚动锁没走 close() 就被残留 */
  stage.innerHTML = "";
  if(view === "C") stage.append(phone("A"), phone("B"));
  else stage.append(phone(view));
  stage.querySelectorAll(".batch-bar").forEach(equalizeBatchBar);
}
/* ?plan=A / ?plan=B：单方案分发链接，只看这一个方案、不需要标题/说明/切换条，
   跟"合在一起"的完整版（无 plan 参数）共用同一份代码，不额外开文件/项目 */
const planParam = (new URLSearchParams(location.search).get("plan") || "").toUpperCase();
const singlePlan = planParam === "A" || planParam === "B";

/* ?select=off：临时关闭"点击卡片多选 + 底部批量操作浮层"这套交互，用于跟保留该
   交互的版本对比；默认（不带这个参数，包括现有已分发的 ?plan=A/B 链接）维持开启，
   不影响任何现有链接。跟 ?plan= 是两个互不干扰的独立参数，可以一起拼在同一个链接
   上，如 ?plan=A&select=off。关闭时只是不响应"点击卡片选中"这个手势、隐藏勾选圆圈，
   长按拖拽排序不受影响 */
const SELECT_ENABLED = (new URLSearchParams(location.search).get("select") || "").toLowerCase() !== "off";
document.body.classList.toggle("no-select", !SELECT_ENABLED);

if(singlePlan){
  document.querySelector(".topbar").style.display = "none";
  render(planParam);
} else {
  render("A");
  document.getElementById("viewSeg").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#viewSeg button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    render(b.dataset.view);
    window.scrollTo({top:0, behavior:"smooth"});
  });
}
